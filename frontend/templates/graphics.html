<div id='control' style='z-index: 999999'>
    <div id="graficos" class='hide'>
        <div class="card white">
            <a class="btn-floating halfway-fab waves-effect waves-light red" id='hide_graficos'><i
                                                                                                   class="material-icons">close</i></a>
            <div class="card-content">
                <div id="chart" style="width: 100%; height: 250px; overflow-x: scroll; overflow-y: hidden"></div>
            </div>
        </div>
    </div>

    <div id="botones">
        <p id='range' class="range-field">
            <input type="range" id="actual_frame" min="1" max="9" value="1"/>
        </p>
        
        <a class="btn-floating waves-effect waves-light" id='click_fast_rewind'><i class="material-icons" id="botones_small">fast_rewind</i></a>
        <a class="btn-floating waves-effect waves-light" id='click_skip_previous'><i class="material-icons" id="botones_small">skip_previous</i></a>
        <a class="btn-floating waves-effect waves-light" id='click_play_arrow'><i class="material-icons" id="botones_small">play_arrow</i></a>
        <a class="btn-floating waves-effect waves-light" id='click_skip_next'><i class="material-icons" id="botones_small">skip_next</i></a>
        <a class="btn-floating waves-effect waves-light" id='click_fast_forward'><i class="material-icons" id="botones_small">fast_forward</i></a>
        
    </div>
</div>

<div id='velocidad' style='display: none; height: 27px'> 
    <p class="range-field" style="margin: 0px; right: 0px; bottom: 0px">
        <input type="range" min="1" max="100" step='1' value='50' id='speed-field'/>
    </p>
    <p class="range-field" style="margin: 0px; left: 20%; bottom: 10px">
        Velocidad: <span id='speed-span'></span>
    </p>
</div>
