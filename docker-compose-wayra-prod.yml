version: "3.4"

services:
  proxy:
    image: registry.gitlab.com/gruporadar/frontend/webmet:proxy
    networks:
      - webmet2-net
      - traefik_net
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "10"
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.webmet2.rule=Host(`webmet2.ohmc.ar`)"
        - "traefik.http.routers.webmet2.entrypoints=websecure"
        - "traefik.http.routers.webmet2.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.webmet2.priority=50"
        - "traefik.http.services.webmet2.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik_net"

  webmet:
    image: registry.gitlab.com/gruporadar/frontend/webmet:latest
    networks:
      - webmet-net
    volumes:
      - /mnt/docker-nfs/webmet2/media:/app/website/config/media
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS=production
      - DOMAIN=webmet2.ohmc.ar
      - DB_HOST=172.16.48.10
      - DB_PORT=5433
      - DB_USER=webmet
      - DB_PASS=ich1paiV2wooTha
      - DB_NAME=webmetdb
      - API_HOST=https://ohmc.ar/webmet
      - EMAIL_HOST_USER=gradar.cba@gmail.com
      - EMAIL_HOST_PASSWORD=#grcordoba#
      - EMAIL_SUPPORT=gradar.cba@gmail.com
      - PYTHONUNBUFFERED=0
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "10"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
networks:
  webmet2-net:
    driver: overlay
  traefik_net:
    external: true


